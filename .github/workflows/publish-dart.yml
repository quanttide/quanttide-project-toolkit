name: publish-dart
on:
  release:
    types: [published]
    tags:
      - 'dart/*'
jobs:
  publishing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: k-paxian/dart-package-publisher@master
        with:
          credentialJson: ${{ secrets.PUBDEV_CREDENTIAL_JSON }}
          relativePath: packages/dart
          force: true
          flutter: false

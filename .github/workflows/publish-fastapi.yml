name: publish-fastapi
on:
  release:
    types: [published]
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: strip path dependency for PyPI
        run: sed -i '/^\[tool\.uv\.sources\]/,/^\[/{//!d;}' packages/fastapi/pyproject.toml && sed -i '/^\[tool\.uv\.sources\]/d' packages/fastapi/pyproject.toml
      - name: install build
        run: python -m pip install build --user
      - name: build
        run: python -m build --sdist --wheel --outdir dist/ packages/fastapi
      - name: publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

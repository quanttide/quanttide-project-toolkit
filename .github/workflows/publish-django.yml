name: publish-django
on:
  release:
    types: [published]
    tags:
      - 'django/*'
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: strip git dependency for PyPI
        run: sed -i 's|django-quanttide = {git = "https://github.com/quanttide/django-quanttide.git"}|django-quanttide = "*"|' packages/django/pyproject.toml
      - name: install build
        run: python -m pip install build --user
      - name: build
        run: python -m build --sdist --wheel --outdir dist/ packages/django
      - name: publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip_existing: true
